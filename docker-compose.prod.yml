services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis_prod
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network
  
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ecommerce_api_prod
    restart: always
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - POSTGRES_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgrespassword}
      - DB_NAME=${DB_NAME:-ecommerce_db}
      - REDIS_ADDR=redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ecommerce_web_prod
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge