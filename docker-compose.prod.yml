services:
  postgres:
    image: postgres:16
    container_name: ecommerce_postgres_prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: ecommerce_redis_prod
    restart: always

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ecommerce_api_prod
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=ecommerce_db
      - REDIS_ADDR=redis:6379
    depends_on:
      - postgres
      - redis
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ecommerce_web_prod
    depends_on:
      - api
    restart: always

  nginx:
    image: nginx:latest
    container_name: ecommerce_nginx_prod
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus_prod
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce_grafana_prod
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: always

volumes:
  postgres_data: